<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden {
      display: none;
    }
    .border-blue-500 {
      border-color: #3b82f6;
    }
  </style>
</head>
<body class="bg-gray-100">
  <!-- Auth  -->
  <div id="authSection" class="min-h-screen flex items-center justify-center px-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
      <!-- Login  -->
      <div id="loginPage" class="border-2 border-gray-800 rounded-lg p-8 bg-white">
        <h2 class="text-center text-xl font-bold mb-8">Login</h2>
        <div class="space-y-4">
          <input
            type="text"
            id="loginName"
            placeholder="name"
            class="w-full border-2 border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-blue-500"
          />
          <input
            type="password"
            id="loginPassword"
            placeholder="pass"
            class="w-full border-2 border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-blue-500"
          />
          <button
            id="loginBtn"
            class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
          >
            Login
          </button>
        </div>
        <p class="text-center text-sm mt-4">
          Don't have account? <a href="#" onclick="switchToRegister()" class="text-blue-500 font-semibold">Register</a>
        </p>
      </div>

      <!-- Registration  -->
      <div id="registerPage" class="hidden border-2 border-blue-500 rounded-lg p-8 bg-white">
        <h2 class="text-center text-xl font-bold mb-8">Registration</h2>
        <div class="space-y-4">
          <input
            type="text"
            id="registerName"
            placeholder="name"
            class="w-full border-2 border-blue-500 rounded px-4 py-2 focus:outline-none focus:border-blue-700"
          />
          <input
            type="password"
            id="registerPassword"
            placeholder="password"
            class="w-full border-2 border-blue-500 rounded px-4 py-2 focus:outline-none focus:border-blue-700"
          />
          <button
            id="registerBtn"
            class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
          >
            Register
          </button>
        </div>
        <p class="text-center text-sm mt-4">
          Already have account? <a href="#" onclick="switchToLogin()" class="text-blue-500 font-semibold">Login</a>
        </p>
      </div>
    </div>
  </div>

  <!-- App  -->
  <div id="appSection" class="hidden min-h-screen bg-gray-100 py-8">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold">My Tasks</h1>
        <button
          id="logoutBtn"
          class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
        >
          Logout
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- To Do  -->
        <div class="bg-white rounded-lg p-6 border-2 border-blue-400">
          <h2 class="text-2xl font-bold text-blue-500 mb-6">TO DO</h2>
          
          <div class="mb-6">
            <input
              type="text"
              id="taskInput"
              placeholder="Add a new task..."
              class="w-full border-2 border-blue-300 rounded px-4 py-2 focus:outline-none focus:border-blue-500"
            />
            <button
              id="addTaskBtn"
              class="w-full mt-2 bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
            >
              Add Task
            </button>
          </div>

          <div id="todoList" class="space-y-2">
           
          </div>
        </div>

        <!-- Done part -->
        <div class="bg-white rounded-lg p-6 border-2 border-green-400">
          <h2 class="text-2xl font-bold text-green-500 mb-6">DONE</h2>
          <div id="doneList" class="space-y-2">
            <!-- Completed tasks  -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
